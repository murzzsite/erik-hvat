name: Blog schedule
# Каждый день в 06:00 UTC (09:00 по Москве) публикует статьи, у которых наступила дата выхода.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish due articles
        run: python3 .github/blog-queue/publish_next.py
      - name: Commit and push
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "blog-bot"
            git config user.email "blog-bot@users.noreply.github.com"
            git add -A
            git commit -m "Публикация статьи по расписанию"
            git push
          else
            echo "nothing to publish"
          fi
