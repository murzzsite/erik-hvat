Хроническая проблема: 1 500–3 000 ₽/час, средний формат работы до 35 часов.
Обширный формат работы от 35 часов при сложных ситуациях. Станет понятно во время диагностики.
Для студентов, пенсионеров и людей с небольшим доходом есть льготные цены.
Предоставляю услугу только по аудиосвязи.</description></offer>
